name: 📚 Documentation link checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-links:
    name: Validate local Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check local Markdown targets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const roots = ['.', 'docs', 'assets', '.github'];
          const seen = new Set();
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.md')) seen.add(full);
            }
          }
          for (const root of roots) walk(root);
          const failures = [];
          const pattern = /!?\[[^\]]*\]\(([^)]+)\)/g;
          for (const file of seen) {
            const source = fs.readFileSync(file, 'utf8');
            for (const match of source.matchAll(pattern)) {
              let target = match[1].trim().split(/\s+/)[0].replace(/^<|>$/g, '');
              if (!target || target.startsWith('#') || /^[a-z][a-z0-9+.-]*:/i.test(target)) continue;
              target = decodeURIComponent(target.split('#')[0]);
              if (!target) continue;
              const resolved = path.resolve(path.dirname(file), target);
              if (!fs.existsSync(resolved)) failures.push(file + ' -> ' + target);
            }
          }
          if (failures.length) {
            console.error('Broken local Markdown targets:');
            for (const item of failures) console.error(' - ' + item);
            process.exit(1);
          }
          console.log('Checked local Markdown targets in ' + seen.size + ' files.');
          NODE
